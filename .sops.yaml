# Recipients for the encrypted files in this repo.
#
# Each host generates its own age identity at /var/lib/sops-nix/key.txt on the
# first rebuild after config/modules/sops.nix landed. Read its public key with:
#
#   sudo age-keygen -y /var/lib/sops-nix/key.txt
#
# Add it below, then `sops updatekeys config/profiles/<profile>/secrets.yaml`
# to re-encrypt existing secrets for the new recipient.
keys:
  # Your personal key, so you can edit every file (get it from
  # `age-keygen -y ~/.config/sops/age/keys.txt`):
  # - &admin age1...
  # Host keys:
  # - &wsl      age1...
  # - &orbstack age1...
  # - &infra-t0 age1...
  # - &infra-t1 age1...

creation_rules:
  - path_regex: config/profiles/wsl/secrets\.yaml$
    key_groups:
      - age: []
        # - *admin
        # - *wsl
  - path_regex: config/profiles/orbstack/secrets\.yaml$
    key_groups:
      - age: []
        # - *admin
        # - *orbstack
  - path_regex: config/profiles/infra-t0/secrets\.yaml$
    key_groups:
      - age: []
        # - *admin
        # - *infra-t0
  - path_regex: config/profiles/infra-t1/secrets\.yaml$
    key_groups:
      - age: []
        # - *admin
        # - *infra-t1
